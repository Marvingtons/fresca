<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" fill="none" stroke-linecap="round" stroke-linejoin="round" font-family="Outfit, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<style>.w{stroke:#2A2521;stroke-width:1.4}.t{stroke:#2A2521;stroke-width:.7;opacity:.55}.a{stroke:#B5593A;stroke-width:1}.lab{font-size:9px;letter-spacing:.16em;fill:#2A2521;opacity:.6}.num{font-size:8px;fill:#F3EFE8}.dim{stroke:#2A2521;stroke-width:.5;opacity:.5}</style>
<!-- outer walls -->
<path class="w" d="M60 60H500V400H60Z"/>
<!-- interior walls with openings -->
<path class="w" d="M60 230H200M240 230H330M330 230V400"/>
<path class="w" d="M330 60V150M330 190V230"/>
<path class="w" d="M200 230V300M200 340V400"/>
<!-- doors -->
<g transform="translate(240 230) rotate(180)"><path d="M0 0V-40" class="w"/><path d="M0 -40A40 40 0 0 1 40 0" class="t"/></g><g transform="translate(330 150) rotate(0)"><path d="M0 0V-40" class="w"/><path d="M0 -40A40 40 0 0 1 40 0" class="t"/></g><g transform="translate(200 340) rotate(0)"><path d="M0 0V-40" class="w"/><path d="M0 -40A40 40 0 0 1 40 0" class="t"/></g>
<!-- windows -->
<path class="w" d="M90 60H180M90 56H180M90 64H180M380 60H470M380 56H470M380 64H470M500 280V360M496 280V360M504 280V360" stroke-width=".8"/>
<!-- kitchen: counters and island -->
<path class="t" d="M345 75H485V95H345Z"/>
<path class="t" d="M470 110V215H490V110Z"/>
<rect class="w" x="385" y="135" width="60" height="26"/>
<circle class="t" cx="360" cy="85" r="5"/><circle class="t" cx="372" cy="85" r="5"/>
<!-- living: sofa, rug, table -->
<rect class="t" x="90" y="250" width="100" height="26" rx="3"/><rect class="t" x="90" y="276" width="100" height="10" rx="2"/>
<rect class="t" x="90" y="300" width="100" height="80" stroke-dasharray="2 3"/>
<circle class="t" cx="140" cy="340" r="14"/>
<!-- bedroom -->
<rect class="t" x="90" y="95" width="80" height="110" rx="2"/><path class="t" d="M90 120H170"/>
<rect class="t" x="200" y="95" width="30" height="20"/><rect class="t" x="200" y="185" width="30" height="20"/>
<!-- bath -->
<rect class="t" x="250" y="75" width="60" height="26" rx="4"/><circle class="t" cx="265" cy="140" r="7"/><rect class="t" x="255" y="170" width="50" height="40" rx="2"/>
<!-- dimension line -->
<path class="dim" d="M60 420H500M60 416V424M500 416V424"/><text class="lab" x="263" y="440">24'-0"</text>
<!-- callouts in terracotta -->
<g font-size="8"><circle cx="415" cy="148" r="7" fill="#B5593A"/><text class="num" x="415" y="151" text-anchor="middle">1</text>
<circle cx="140" cy="263" r="7" fill="#B5593A"/><text class="num" x="140" y="266" text-anchor="middle">2</text>
<circle cx="130" cy="150" r="7" fill="#B5593A"/><text class="num" x="130" y="153" text-anchor="middle">3</text></g>
<!-- schedule on the right -->
<g transform="translate(540 70)">
<text class="lab" x="0" y="0">SCHEDULE</text>
<path class="dim" d="M0 10H120"/>
<g transform="translate(0 24)"><circle cx="6" cy="0" r="6" fill="#B5593A"/><text class="num" x="6" y="2.5" text-anchor="middle">1</text><text class="lab" x="20" y="3" style="letter-spacing:.04em;opacity:.9">Island, white oak</text><path class="dim" d="M0 14H120"/></g>
<g transform="translate(0 54)"><circle cx="6" cy="0" r="6" fill="#B5593A"/><text class="num" x="6" y="2.5" text-anchor="middle">2</text><text class="lab" x="20" y="3" style="letter-spacing:.04em;opacity:.9">Sofa, linen, 84"</text><path class="dim" d="M0 14H120"/></g>
<g transform="translate(0 84)"><circle cx="6" cy="0" r="6" fill="#B5593A"/><text class="num" x="6" y="2.5" text-anchor="middle">3</text><text class="lab" x="20" y="3" style="letter-spacing:.04em;opacity:.9">Bed, upholstered</text><path class="dim" d="M0 14H120"/></g>
<text class="lab" x="0" y="130" style="letter-spacing:.04em;opacity:.5">Signed before ordering</text>
</g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>